<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board Foot Calculator</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../dist/css/boardfoot.min.css" />
    <script>
      document.documentElement.style.visibility = "hidden";
    </script>
    <script src="../../dist/js/auth-guard.min.js"></script>

</head>
<body>
<div class="app">
  <header class="site-header">
    <div class="header-inner">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#1c1a0d" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg></div>
      <div class="header-titles">
        <h1>Board Foot Calculator</h1>
        <div class="sub">Total lumber &amp; cost across every board</div>
      </div>
      <button class="icon-btn" id="exitBtn" aria-label="Exit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
  </header>

  <section class="block">
    <div class="block-title">Boards</div>
    <div class="card">
      <div class="col-head"><span>Description</span><span>Thick (in)</span><span>Wide (in)</span><span>Long (ft)</span><span>Qty</span><span></span></div>
      <div id="boardsList"></div>
      <button class="add-row" id="addBoardBtn">+ Add Board</button>
      <div class="price-row">
        <label>Price per board foot</label>
        <input type="number" id="priceInput" value="0" min="0" step="0.01">
      </div>
    </div>
    <div class="totals-box">
      <div class="total-stat"><div class="k">Total Board Feet</div><div class="v" id="totalBF">0 BF</div></div>
      <div class="total-stat"><div class="k">Total Cost</div><div class="v" id="totalCost">₹0</div></div>
    </div>
  </section>

  <footer class="note">Board foot = Thickness(in) × Width(in) × Length(ft) ÷ 12, per board — summed and multiplied by quantity.</footer>
</div>
<script src="../../dist/js/tt.min.js"></script>
<script src="../../dist/js/boardfeet.min.js">
</script>
</body>
</html>
