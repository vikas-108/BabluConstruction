<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS Site Walker</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../dist/css/sitewalker.min.css" />
    <script>
      document.documentElement.style.visibility = "hidden";
    </script>
    <script src="../../dist/js/auth-guard.min.js"></script>

</head>
<body>
<div class="app">
  <header class="site-header">
    <div class="header-inner">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#1c1a0d" stroke-width="1.8"><path d="M12 21s7-7.5 7-12a7 7 0 10-14 0c0 4.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></div>
      <div class="header-titles">
        <h1>GPS Site Walker</h1>
        <div class="sub">Walk the boundary, get area &amp; perimeter</div>
      </div>
      <button class="icon-btn" id="exitBtn" aria-label="Exit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
  </header>

  <section class="block">
    <div class="card">
      <div class="gps-status">
        <span class="gps-dot" id="gpsDot"></span>
        <span class="gps-text" id="gpsText">Waiting for GPS…</span>
      </div>

      <div class="shape-wrap"><svg id="shapeSvg" viewBox="0 0 220 220"></svg></div>

      <div class="points-list" id="pointsList"></div>

      <div class="btn-row">
        <button class="gbtn ghost" id="undoBtn">Undo</button>
        <button class="gbtn primary" id="addBtn">+ Add Point Here</button>
      </div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="gbtn danger" id="resetBtn">Reset</button>
      </div>

      <div class="result-box">
        <div class="result-stat"><div class="k">Perimeter</div><div class="v" id="perimVal">—</div></div>
        <div class="result-stat"><div class="k">Area</div><div class="v" id="areaVal">—</div></div>
      </div>
    </div>
  </section>

  <footer class="note">
    Walk to each corner of the boundary and tap "Add Point Here" — closes automatically once you have 3+ points.<br>
    Consumer GPS is typically accurate to 3–8 m, so treat this as a rough estimate, not a survey.
  </footer>
</div>
<script src="../../dist/js/tt.min.js"></script>
<script src="../../dist/js/sitewaker.min.js">
</script>
</body>
</html>
