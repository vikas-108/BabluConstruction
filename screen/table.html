<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>Responsive Dynamic Table</title>
   <!-- Add Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/table.css"/>
  <link rel="stylesheet" href="../css/loader.css"/>
   <!-- Prevents unauthenticated users from seeing a flash of content -->
  <script>document.documentElement.style.visibility = 'hidden';</script>
  
  <!-- Your common auth guard -->
  <script src="/js/auth-guard.js"></script>
</head>
<body>
  <div class="container">
    <div id="toastContainer"></div>
    <div class="page-header">
    <span class="back-btn" onclick="goBack()">←</span>
    <h2>T.DATA</h2>
</div>
    <input type="text" id="tableTitle" placeholder="Enter title">
    <button id="createBtn">Create Table</button>
     <div id="tableLimitInfo" class="table-limit"></div>
    <div id="tablesWrapper"></div>
  </div>
   <!-- ================= SHARE TABLE MODAL ================= -->
<div id="shareModal" class="share-modal">

  <div class="share-modal-content">

    <!-- Header -->
    <div class="share-header">
      <h3><i class="fa-solid fa-share-nodes"></i> Share Table</h3>

      <button id="closeShareModal" class="close-share">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Phone -->
    <div class="share-input-group">

      <label>Phone Number</label>

      <input
        type="tel"
        id="sharePhone"
        placeholder="Enter registered phone number">

    </div>

    <!-- Permission -->
    <div class="share-input-group">

      <label>Permission</label>

      <select id="sharePermission">
        <option value="view">Can View</option>
        <option value="edit">Can Edit</option>
      </select>

    </div>

    <!-- Share Button -->
    <button id="shareNowBtn" class="share-btn">
      <i class="fa-solid fa-paper-plane"></i>
      Share
    </button>

    <hr>

    <!-- Shared Users -->
    <div class="shared-users">

      <h4>Shared With</h4>

      <div id="sharedUsersList">

      </div>

    </div>

  </div>

</div>
   <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <!-- <script src="../js/screenshotProtector.js"></script>
  
<script>
  // One single line to activate
  initScreenshotProtector();
</script> -->
  <script src="../js/loader.js"></script>
  <script src="../js/table.js"></script>
</body>
</html>
