<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Site Register — Project Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/png" href="/favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<link rel="stylesheet" href="../css/cltprofile.css" />
 <!-- Prevents unauthenticated users from seeing a flash of content -->
  <script>document.documentElement.style.visibility = 'hidden';</script>
  
  <!-- Your common auth guard -->
  <script src="/js/auth-guard.js"></script>
</head>
<body>

<div class="page">
  <div class="wrap">
 
    <!-- Top bar -->
    <div class="topbar">
      <div>
        <div class="eyebrow">
          <h2 class="page-title">
            <button class="header-back-btn" id="back" aria-label="Go Back">
        ←
    </button> <span>Project REGISTER</span> </h2>
    </div>
      </div>
      <button type="button" id="createBtn" class="btn btn-dark">
        <i data-lucide="plus"></i> Project
      </button>
    </div>
 
    <!-- API error banner (hidden unless a request fails) -->
    <div id="errorBanner" class="error-banner hidden">
      <i data-lucide="alert-triangle"></i>
      <span id="errorBannerText"></span>
      <button type="button" id="errorBannerClose" aria-label="Dismiss"><i data-lucide="x"></i></button>
    </div>
 
    <!-- Form (hidden by default) -->
    <div id="formSection" class="form-section hidden">
      <div class="form-header blueprint-grid">
        <div>
          <div class="eyebrow eyebrow-orange" id="formEyebrow">NEW WORK ORDER</div>
          <h1 class="form-title" id="formTitle">New project intake</h1>
        </div>
        <div class="form-no">
          FORM&nbsp;NO.<br /><span id="formNo">PRJ-001</span>
        </div>
      </div>
 
      <div class="form-body">
 
        <div class="field">
          <div class="field-num">01</div>
          <div class="field-content">
            <div class="field-label-row"><label class="field-label">Project name</label></div>
            <input type="text" id="f-name" placeholder="e.g. Riverside Residency — Block C" />
          </div>
        </div>
 
        <div class="field">
          <div class="field-num">02</div>
          <div class="field-content">
            <div class="field-label-row"><label class="field-label">Place / address</label></div>
            <div class="input-icon-wrap">
              <i data-lucide="map-pin" class="input-icon"></i>
              <input type="text" id="f-address" placeholder="Street, locality, pin code" style="padding-left:38px" />
            </div>
          </div>
        </div>
 
        <div class="field">
          <div class="field-num">03</div>
          <div class="field-content">
            <div class="field-label-row"><label class="field-label">State</label></div>
            <div class="select-wrap">
              <select id="f-state">
                <option value="" disabled selected>Select state</option>
              </select>
              <i data-lucide="chevron-down" class="select-caret"></i>
            </div>
          </div>
        </div>
 
        <div class="field">
          <div class="field-num">04</div>
          <div class="field-content">
            <div class="field-label-row"><label class="field-label">District</label></div>
            <div class="select-wrap">
              <select id="f-district" disabled>
                <option value="" disabled selected>Select a state first</option>
              </select>
              <i data-lucide="chevron-down" class="select-caret"></i>
            </div>
          </div>
        </div>
 
        <div class="field">
          <div class="field-num">05</div>
          <div class="field-content">
            <div class="field-label-row">
              <label class="field-label">Budget</label>
              <span class="field-hint">INR</span>
            </div>
            <div class="input-icon-wrap">
              <i data-lucide="indian-rupee" class="input-icon"></i>
              <input type="number" id="f-budget" placeholder="0.00" style="padding-left:38px; font-family:'IBM Plex Mono',monospace" />
            </div>
          </div>
        </div>
 
        <div class="field">
          <div class="field-num">06</div>
          <div class="field-content">
            <div class="field-label-row"><label class="field-label">Project description</label></div>
            <div class="input-icon-wrap">
              <i data-lucide="file-text" class="input-icon" style="top:13px"></i>
              <textarea id="f-description" rows="4" placeholder="Scope of work, site conditions, timeline expectations..." style="padding-left:38px"></textarea>
            </div>
          </div>
        </div>
 
        <div class="field">
          <div class="field-num">07</div>
          <div class="field-content">
            <div class="field-label-row">
              <label class="field-label">Requirement</label>
              <span class="field-hint" id="reqCount"></span>
            </div>
            <div class="req-grid" id="reqGrid"></div>
          </div>
        </div>
 
        <div id="roleSection" class="role-section hidden">
          <div class="field-num role-num">08</div>
          <div class="field-content">
            <div class="field-label-row">
              <label class="field-label">Role — <span class="role-req-name" id="roleReqName"></span></label>
            </div>
            <div class="select-wrap">
              <select id="f-role">
                <option value="" disabled selected>Select a role</option>
              </select>
              <i data-lucide="chevron-down" class="select-caret"></i>
            </div>
          </div>
        </div>
 
        <div class="publish-row">
          <button type="button" id="publishBtn" class="btn btn-publish" disabled>Publish project</button>
        </div>
        <p class="hint-text" id="incompleteHint">Fill in name, address, state, district, budget, requirement and role to publish.</p>
      </div>
    </div>
 
    <!-- Loading state -->
    <div id="loadingState" class="empty-state hidden">Loading your projects…</div>
 
    <!-- Empty state -->
    <div id="emptyState" class="empty-state hidden">No projects published yet.</div>
 
    <!-- Published cards -->
    <div id="cardsList" class="cards-list"></div>
 
  </div>
</div>
 <div id="pageLoader" class="page-loader">
    <div class="loader-box">
        <div class="spinner"></div>
        <p>Please wait...</p>
    </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/cltprofile.js" defer></script>
</body>
</html>
