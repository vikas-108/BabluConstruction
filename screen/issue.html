<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Report an Issue</title>

    <link rel="stylesheet" href="../dist/css/issue.min.css">
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
         <script>document.documentElement.style.visibility = 'hidden';</script>
  
  <!-- Your common auth guard -->
  <script src="../dist/js/auth-guard.min.js"></script>

</head>

<body>

    <main class="issue-page">

        <section class="issue-card">

            <div class="header">

                <div class="icon">
                    <i class="fa-solid fa-circle-exclamation"></i>
                </div>

                <h1>Report an Issue</h1>

                <p>
                    Help us improve this application by reporting
                    any problem you experience.
                </p>

            </div>


            <form id="issueForm">

                <!-- Problem Type -->

                <div class="form-group">

                    <label for="issueType">
                        Select Problem
                    </label>

                    <select id="issueType" required>

                        <option value="">
                            -- Select Issue --
                        </option>

                        <option value="Login Problem">
                            Login Problem
                        </option>

                        <option value="Registration Problem">
                            Registration Problem
                        </option>

                        <option value="OTP Issue">
                           account details
                        </option>

                        <option value="Application Crash">
                            Application Crash
                        </option>

                        <option value="Website Slow">
                            Website Running Slow
                        </option>

                        <option value="Loading Problem">
                            Data Not Loading
                        </option>

                        <option value="Map Issue">
                            Map Problem
                        </option>

                        <option value="Chat Issue">
                            media upoading issue
                        </option>

                        <option value="Camera Issue">
                            Camera Problem
                        </option>

                        <option value="Payment Issue">
                            scanner Issue
                        </option>

                        <option value="Billing Issue">
                            Billing Issue
                        </option>

                        <option value="Wrong Information">
                            Wrong Information
                        </option>

                        <option value="Feature Request">
                            Request New Feature
                        </option>

                        <option value="Security Issue">
                            Security Issue
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Other Problem -->

                <div class="form-group hidden"
                    id="otherProblemBox">

                    <label>
                        Enter Your Problem
                    </label>

                    <input
                        type="text"
                        id="otherProblem"
                        maxlength="100"
                        placeholder="Write your issue title">

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label>
                        Describe the Issue
                    </label>

                    <textarea
                        id="description"
                        maxlength="500"
                        rows="6"
                        placeholder="Explain what happened, when it happened, and how we can reproduce the problem."
                        required></textarea>

                    <div class="counter">
                        <span id="charCount">
                            0
                        </span>/500
                    </div>

                </div>
                 <!-- Preview -->

                <div class="preview hidden"
                    id="previewBox">

                    <img
                        id="previewImage"
                        alt="Preview">

                </div>


                <!-- Loading -->

                <div
                    class="loading hidden"
                    id="loading">

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    Sending Report...

                </div>


                <!-- Message -->

                <div
                    id="responseMessage">

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="submit-btn">

                    <i class="fa-solid fa-paper-plane"></i>

                    Submit Report

                </button>

            </form>
<!-- ============================= -->
<!-- MY REPORTED ISSUES -->
<!-- ============================= -->

<section class="my-issues-section">

    <div class="my-issues-header">
        <h2>
            <i class="fa-solid fa-list-check"></i>
            My Reported Issues
        </h2>

        <button
            type="button"
            id="refreshIssuesBtn"
            class="refresh-issues-btn"
            title="Refresh Issues">

            <i class="fa-solid fa-rotate"></i>

        </button>
    </div>


    <div
        id="issuesLoading"
        class="issues-loading hidden">

        <i class="fa-solid fa-spinner fa-spin"></i>

        Loading your issues...

    </div>


    <div
        id="issuesError"
        class="issues-error hidden">
    </div>


    <div
        id="issuesList"
        class="issues-list">
    </div>


    <div
        id="noIssues"
        class="no-issues hidden">

        <i class="fa-regular fa-circle-check"></i>

        <h3>No Issues Reported</h3>

        <p>
            You have not reported any issues yet.
        </p>

    </div>

</section>
        </section>

    </main>

    <script src="../dist/js/issue.min.js"></script>

</body>

</html>
