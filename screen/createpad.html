<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blueprint Builder</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  
  <link rel="stylesheet" href="../dist/css/createpad.min.css">
   <!-- Prevents unauthenticated users from seeing a flash of content -->
  <script>document.documentElement.style.visibility = 'hidden';</script>
  
  <!-- Your common auth guard -->
  <script src="../dist/js/auth-guard.min.js"></script>
</head>
<body>
  <div id="toast" style="
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #333;
  color: #fff;
  padding: 10px 20px;
  border-radius: 5px;
  opacity: 0;
  transition: opacity 0.5s ease;
  z-index: 9999;
"></div>
  <div id="toolbar">
       <button class="header-back-btn" onclick="goBack()" aria-label="Go Back">
        ←
    </button>
    <select id="buildingType">
      <option value="">select word</option>
      <option value="house">House</option>
      <option value="office">Office</option>
      <option value="hospital">Hospital</option>
      <option value="school">School</option>
    </select>
    <input type="number" id="landArea" placeholder="Enter land area (sq ft)">
    <button id="startBtn">Start Blueprint</button>
  </div>
  <!-- Info bar after start -->
  <!--<div id="infoBar" style="display:none;"></div>-->
  <!-- Floating inputs -->
<input type="text" id="dimensionInput" 
       style="position:absolute; display:none; z-index:20; border:1px solid #333; padding:2px;" />
<input type="text" id="angleInput" 
       style="position:absolute; display:none; z-index:20; border:1px solid #333; padding:2px;" />

  <canvas id="blueprintCanvas"></canvas>
 <div id="exportOptions">
  <button id="eraseBtn">Erase</button>
  
  <button id="downloadBtn">Download</button>
  <button id="copyBtn">Copy</button>
</div>
<script src="../dist/js/screenshotProtector.min.js"></script>
<script>
  // One single line to activate
  initScreenshotProtector();
</script>
  <script src="../dist/js/createpad.min.js"></script>
</body>
</html>
