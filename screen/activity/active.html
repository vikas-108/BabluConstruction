<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Activity Dashboard</title>
     <link rel="icon" type="image/png" href="../../favicon.png" />
    <link rel="stylesheet" href="../../dist/css/active.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Login Activity</h1>
            <p>Review and manage your active sessions. If you don't recognize a device, log it out immediately.</p>
        </header>

        <main class="activity-box">
            <h2>Where You're Logged In</h2>
            <div id="session-list" class="session-list">
                <!-- JavaScript will dynamically insert active sessions here -->
            </div>
        </main>
    </div>
    <script src="../../dist/js/active.min.js"></script>
</body>
</html>
